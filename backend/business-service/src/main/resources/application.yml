spring:
  application:
    name: factoryops-business-service
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000

factoryops:
  outbox:
    publisher:
      enabled: false
      poll-delay: 1s
      batch-size: 50
      delivery-timeout: 10s
