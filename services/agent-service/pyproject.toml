[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryops-agent-service"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "confluent-kafka>=2.8,<3",
  "jsonschema>=4.23,<5",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "testcontainers[kafka,mysql]>=4.10,<5",
]

[project.scripts]
factoryops-agent-ingress = "factoryops_agent_service.event_ingress.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"factoryops_agent_service.event_ingress.migrations" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "../.."]
